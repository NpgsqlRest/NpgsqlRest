name: Test

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches-ignore:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [15, 16, 17]
    steps:
    - name: Install PostgreSQL
      uses: vb-consulting/postgresql-action@v1
      with:
        postgresql version: '${{ matrix.postgres-version }}'
        postgresql user: 'postgres'
        postgresql password: 'postgres'
    - uses: actions/checkout@v4
    - name: Setup .NET 10 and .NET 11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          11.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity m
    - name: Test on .NET 10
      # The library and plugins also target net10.0 (LTS): run the whole suite against that build too.
      run: dotnet test NpgsqlRestTests/NpgsqlRestTests.csproj -c Release -p:NpgsqlRestTestFramework=net10.0 --verbosity m

  aot-smoke:
    # Publishes the native AOT executable and serves real requests with it. A version check is not enough:
    # a native AOT build once passed it and crashed on its first request.
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - name: Build Linux AOT
      run: dotnet publish ./NpgsqlRestClient/NpgsqlRestClient.csproj -r linux-x64 -c Release
    - name: AOT smoke test (real requests)
      run: ./.github/scripts/aot-smoke-test.sh ./NpgsqlRestClient/bin/Release/net11.0/linux-x64/publish/NpgsqlRestClient

  release-builds:
    # A rehearsal of what the release workflow builds and nothing here runs before a release: the native AOT
    # executable for the other platforms. The release publishes to NuGet before it builds these, so a build
    # that fails there leaves a release without some of its binaries.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            exe: NpgsqlRestClient.exe
          - os: ubuntu-22.04-arm
            rid: linux-arm64
            exe: NpgsqlRestClient
          - os: macos-latest
            rid: osx-arm64
            exe: NpgsqlRestClient
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - name: Build AOT (${{ matrix.rid }})
      run: dotnet publish ./NpgsqlRestClient/NpgsqlRestClient.csproj -r ${{ matrix.rid }} -c Release
    - name: The executable starts and reports the version in version.txt
      shell: bash
      run: |
        OUT=$(./NpgsqlRestClient/bin/Release/net11.0/${{ matrix.rid }}/publish/${{ matrix.exe }} --version)
        echo "$OUT"
        echo "$OUT" | grep -E "^NpgsqlRestClient[[:space:]]+$(cat version.txt)\.0"

  release-images:
    # The same for the Docker images: built as the release builds them, not pushed.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - name: Build Linux AOT
      run: dotnet publish ./NpgsqlRestClient/NpgsqlRestClient.csproj -r linux-x64 -c Release
    - name: AOT image (docker/Dockerfile) runs the executable
      run: |
        cp ./NpgsqlRestClient/bin/Release/net11.0/linux-x64/publish/NpgsqlRestClient ./docker/NpgsqlRestClient
        chmod +x ./docker/NpgsqlRestClient
        docker build -f docker/Dockerfile -t npgsqlrest-check:aot ./docker
        docker run --rm npgsqlrest-check:aot --version | grep -E "^NpgsqlRestClient[[:space:]]+$(cat version.txt)\.0"
    - name: Bun image (docker/Dockerfile.bun) runs the executable
      run: |
        docker build -f docker/Dockerfile.bun -t npgsqlrest-check:bun ./docker
        docker run --rm npgsqlrest-check:bun --version | grep -E "^NpgsqlRestClient[[:space:]]+$(cat version.txt)\.0"
    - name: JIT image (docker/Dockerfile.jit) builds and reports the version in version.txt
      run: |
        docker build -f docker/Dockerfile.jit -t npgsqlrest-check:jit .
        docker run --rm npgsqlrest-check:jit --version | grep -E "^NpgsqlRestClient[[:space:]]+$(cat version.txt)\.0"
